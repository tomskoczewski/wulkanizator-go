    <line x1="16" y1="3" x2="16" y2="9" transform="rotate(90 16 16)" />
    <line x1="16" y1="3" x2="16" y2="9" transform="rotate(135 16 16)" />
    <line x1="16" y1="3" x2="16" y2="9" transform="rotate(180 16 16)" />
    <line x1="16" y1="3" x2="16" y2="9" transform="rotate(225 16 16)" />
    <line x1="16" y1="3" x2="16" y2="9" transform="rotate(270 16 16)" />
    <line x1="16" y1="3" x2="16" y2="9" transform="rotate(315 16 16)" />
